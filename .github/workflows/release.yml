name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      # Caches the Gradle user home so the dependencies are not downloaded every run.
      - uses: gradle/actions/setup-gradle@v4

      # The release is signed with the repository's key. If the secrets are gone the
      # build fails here, rather than quietly producing a debug-signed APK.
      - name: Require the signing secrets
        env:
          BONK_KEYSTORE_BASE64: ${{ secrets.BONK_KEYSTORE_BASE64 }}
          BONK_KEYSTORE_PASSWORD: ${{ secrets.BONK_KEYSTORE_PASSWORD }}
          BONK_KEY_ALIAS: ${{ secrets.BONK_KEY_ALIAS }}
          BONK_KEY_PASSWORD: ${{ secrets.BONK_KEY_PASSWORD }}
        run: |
          missing=0
          for secret in BONK_KEYSTORE_BASE64 BONK_KEYSTORE_PASSWORD BONK_KEY_ALIAS BONK_KEY_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "::error::the secret $secret is not set on this repository"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Decode the signing key
        env:
          BONK_KEYSTORE_BASE64: ${{ secrets.BONK_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$BONK_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bonk-release.jks"
          echo "BONK_KEYSTORE=$RUNNER_TEMP/bonk-release.jks" >> "$GITHUB_ENV"

      - name: Build the signed release
        env:
          BONK_KEYSTORE_PASSWORD: ${{ secrets.BONK_KEYSTORE_PASSWORD }}
          BONK_KEY_ALIAS: ${{ secrets.BONK_KEY_ALIAS }}
          BONK_KEY_PASSWORD: ${{ secrets.BONK_KEY_PASSWORD }}
        # No configuration cache: the signing configuration is read from the
        # environment, and a restored cache must never be able to serve a
        # configuration that was built without the key.
        run: ./gradlew :app:assembleRelease --no-configuration-cache

      - name: Verify the signature
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)"
          certs="$("$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk)"
          echo "$certs"
          if echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::the release APK is signed with the debug key"
            exit 1
          fi

      - name: Checksums
        run: sha256sum app/build/outputs/apk/release/app-release.apk > SHA256SUMS.txt

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            SHA256SUMS.txt

      # The key never survives the runner.
      - name: Delete the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/bonk-release.jks"
