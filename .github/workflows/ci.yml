name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The runner ships an Android SDK with a current command-line-tools, so the
      # packages the build needs are installed with it directly.
      - name: Install the Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1 || true)"
          if [ -z "$sdkmanager" ]; then
            sdkmanager="$(command -v sdkmanager)"
          fi
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - name: Build and test
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lintDebug
