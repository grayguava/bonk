# R8 loads the whole program into memory to shrink it, and it runs inside the Gradle
# daemon. 512 MB of Metaspace is enough for the Kotlin compiler but not for R8, which
# then spends the build thrashing the garbage collector.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.compiler.execution.strategy=in-process

# The Kotlin plugin keeps a little project-level scratch state of its own, in a
# .kotlin folder at the root. It cannot be moved with a relative path here: the
# plugin uses the value as given, so a relative one is resolved against the
# daemon's directory and the compiler cannot find the session file. A machine
# that wants it elsewhere can set an absolute path in its own gradle.properties
# under the Gradle home.

android.useAndroidX=true
android.nonTransitiveRClass=true
